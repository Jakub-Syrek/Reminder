<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>My Reminders</h1>

    <div class="form-section">
      <h2>Add New Reminder</h2>

      <div class="form-group">
        <label for="reminderText">Text:</label>
        <textarea id="reminderText" placeholder="What do you want to remember?" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="reminderDate">Date and Time:</label>
        <input type="datetime-local" id="reminderDate">
      </div>

      <button id="addBtn" class="btn-primary">Add Reminder</button>
    </div>

    <div class="reminders-section">
      <h2>Scheduled Reminders</h2>
      <ul id="remindersList" class="reminders-list"></ul>
      <p id="emptyMessage" class="empty-message">No scheduled reminders</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
