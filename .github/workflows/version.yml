name: release

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  release:
    name: Semantic version bump and release
    runs-on: ubuntu-latest
    # Skip the release commit itself to avoid an infinite loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git author
        run: |
          git config user.name "Jakub Syrek"
          git config user.email "jakubvonsyrek@gmail.com"

      - name: Determine current and next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:'%s%n%b%n---END---')
            CURRENT=$(node -p "require('./package.json').version")
          else
            COMMITS=$(git log "$LAST_TAG"..HEAD --pretty=format:'%s%n%b%n---END---')
            CURRENT=${LAST_TAG#v}
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -qE '^BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '^(fix|docs|test|refactor|perf|chore|ci)(\(.+\))?:'; then
            BUMP="patch"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            none) echo "No release-worthy commits since $LAST_TAG"; echo "bump=none" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          NEXT="$MAJOR.$MINOR.$PATCH"
          echo "Current: $CURRENT  Bump: $BUMP  Next: $NEXT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump manifest.json and package.json
        if: steps.version.outputs.bump != 'none'
        shell: bash
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          node -e "const fs=require('fs');const p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.version='$NEXT';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"
          node -e "const fs=require('fs');const p='./manifest.json';const j=JSON.parse(fs.readFileSync(p));j.version='$NEXT';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

      - name: Commit, tag and push
        if: steps.version.outputs.bump != 'none'
        shell: bash
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          git add manifest.json package.json
          git commit -m "chore(release): v$NEXT"
          git tag "v$NEXT"
          git push origin HEAD
          git push origin "v$NEXT"

      - name: Package extension ZIP
        if: steps.version.outputs.bump != 'none'
        shell: bash
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          ZIP="reminder-extension-v$NEXT.zip"
          zip -r "$ZIP" manifest.json popup.html alert.html alert.js styles.css images src \
            -x '*.crx' -x 'node_modules/*' -x 'tests/*' -x 'coverage/*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.version.outputs.bump != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.next }}
          name: v${{ steps.version.outputs.next }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
